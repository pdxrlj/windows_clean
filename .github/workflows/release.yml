# CleanSweep — tag-triggered Windows release pipeline
# =============================================================================
# How to cut a release:
#   1. Bump the version in package.json, src-tauri/tauri.conf.json and
#      src-tauri/Cargo.toml, then commit and push.
#   2. Create and push a version tag:
#          git tag v0.1.0
#          git push origin v0.1.0
#   Pushing the tag builds the app on windows-latest and publishes a GitHub
#   Release for that tag with the installers attached. No manual inputs needed.
#
# Required repository settings (one-time):
#   Settings -> Actions -> General -> Workflow permissions
#     -> "Read and write permissions"
#   This is required so the workflow's GITHUB_TOKEN can create the Release
#   and upload the assets.
#
# Release assets (tauri.conf.json bundle targets: "all"):
#   - CleanSweep_<version>_x64_en-US.msi    WiX MSI installer
#   - CleanSweep_<version>_x64-setup.exe    NSIS installer (recommended)
#   - CleanSweep.exe                        portable executable
#
# Optional code signing (NOT enabled):
#   Add TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD to
#   repository secrets and expose them as env vars on the tauri-action step.
#   See https://tauri.app/distribute/sign/windows/
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs only build the bundles (no Release is published, because there
  # is no tag to attach it to). Useful as a smoke test.
  workflow_dispatch:

permissions:
  contents: write

# Never let two releases for the same ref write the same Release concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action runs `pnpm tauri build`, which also runs the
      # `beforeBuildCommand` ("pnpm build") from tauri.conf.json.
      - name: Build & publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On a tag push github.ref_name is the tag (e.g. "v0.1.0"); on a
          # manual run it is a branch name, so it is cleared to avoid creating
          # a Release/tag for a branch.
          tagName: "${{ github.event_name == 'push' && github.ref_name || '' }}"
          releaseName: "CleanSweep ${{ github.ref_name }}"
          releaseBody: |
            ## CleanSweep ${{ github.ref_name }} — Windows installer

            AI-assisted Windows uninstaller: enumerate installed software,
            uninstall cleanly, scan for leftover files and registry keys, and
            let the built-in AI assistant explain what each program does and
            which residuals are safe to remove.

            ### Downloads
            | Asset | Description |
            | --- | --- |
            | `CleanSweep_*_x64-setup.exe` | NSIS installer (recommended) |
            | `CleanSweep_*_x64_en-US.msi` | WiX MSI installer (enterprise deployment) |
            | `CleanSweep.exe` | Portable executable (no installation, needs admin/UAC) |

            ### Install
            1. Download the `-setup.exe` (or the `.msi`) below.
            2. Run it and follow the wizard.
            3. Launch CleanSweep and (optionally) configure an AI provider in Settings.

            > Windows SmartScreen may show a warning because the binaries are
            > not code-signed. Choose "More info" -> "Run anyway".

            **Full changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri
          # Build both Windows installer formats explicitly (equivalent to the
          # "all" target in tauri.conf.json on Windows).
          args: --bundles nsis,msi

      # tauri-action only uploads the packaged MSI/NSIS bundles, so attach the
      # raw executable as a portable download as well (tag pushes only).
      # Cargo package name is `windows-clean`, so the binary is
      # src-tauri/target/release/windows-clean.exe; it is uploaded as
      # CleanSweep.exe. `gh` is preinstalled on GitHub-hosted runners.
      - name: Upload portable exe
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item src-tauri/target/release/windows-clean.exe CleanSweep.exe
          gh release upload "${{ github.ref_name }}" CleanSweep.exe --repo "${{ github.repository }}" --clobber
